spring.application.name=calc-api-app
server.port=8091

# Local credentials live in application-local.yml at the PROJECT ROOT -- gitignored,
# and deliberately not under src/main/resources, because anything there is packaged
# into the jar.
spring.config.import=optional:file:./application-local.yml

spring.ai.anthropic.chat.options.model=claude-haiku-4-5-20251001

# Sub-agents reach the calculator through the MCP server, not their own REST calls.
spring.ai.mcp.client.type=sync
spring.ai.mcp.client.name=calc-api-app
spring.ai.mcp.client.streamable-http.connections.calc.url=http://localhost:8092
spring.ai.mcp.client.streamable-http.connections.calc.endpoint=/mcp
# Don't handshake at startup: /api/calc/* must keep working when the MCP server is
# down, and it starts after this app anyway. The session opens on first use.
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.request-timeout=10s
# The sub-agents call tools directly; nothing hands MCP tools to the LLM here.
spring.ai.mcp.client.toolcallback.enabled=false
